[project]
name = "tts-mlx-audio"
version = "0.1.0"
description = "Consolidated mlx-audio TTS service — Qwen3-TTS, Chatterbox, Chatterbox-Multilingual, Voxtral-TTS, Higgs-TTS, Svara-TTS (native MLX/Apple Silicon)."
requires-python = ">=3.13"
dependencies = [
    # [tts] extra pulls in mistral-common[audio] + sentencepiece, needed by
    # Voxtral-TTS specifically.
    "mlx-audio[tts]>=0.4.4",
    "soundfile>=0.12.1",
    "numpy",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false
