[project]
name = "tts-veena"
version = "0.1.0"
description = "maya-research/Veena base TTS (Hindi + English, tensorblock GGUF quant, via llama.cpp + SNAC) for vidgen"
requires-python = ">=3.11"
dependencies = [
    "llama-cpp-python>=0.3.0",
    "snac>=1.2.1",
    "torch>=2.2",
    "soundfile>=0.12.1",
    "numpy",
    "huggingface-hub>=0.25",
]

[tool.uv]
package = false
