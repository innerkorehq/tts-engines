[project]
name = "tts-indicf5"
version = "0.1.0"
description = "IndicF5 voice-clone synthesis service"
requires-python = ">=3.11"
dependencies = [
    "f5-tts @ git+https://github.com/ai4bharat/IndicF5.git",
    "transformers==5.2.0",
    "huggingface-hub>=1.3.0,<2.0",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "numpy==1.26.4",
    "tokenizers==0.22.2",
    "protobuf==7.35.1",
    "soundfile>=0.12.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false
