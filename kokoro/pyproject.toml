[project]
name = "tts-kokoro"
version = "0.1.0"
description = "Kokoro TTS synthesis service (incl. eSpeak phoneme support)"
requires-python = ">=3.11"
dependencies = [
    "kokoro>=0.9.4",
    "soundfile>=0.12.1",
    "numpy",
    "torch>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv]
package = false
